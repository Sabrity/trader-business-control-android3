name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync Client App into Android assets
        run: cp "Client App/index.html" "Client App/android/app/src/main/assets/index.html"
      - name: Build APK
        working-directory: Client App/android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Client App/android/app/build/outputs/apk/debug/app-debug.apk
